<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Emo Bot Face | HaxorAI Samuel</title>
    <meta name="author" content="Samuel Pasaribu" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Emo Bot Face - Interactive AI-inspired UI project by Samuel Pasaribu. A lightweight animated bot interface built with HTML, CSS, and JavaScript under HaxorAI development." />
    <meta name="keywords" content="Emo Bot, HaxorAI Emo, AI Bot Face, Samuel Pasaribu, Web Developer, HTML CSS JavaScript, Interactive Bot UI, Portfolio Project" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta property="og:title" content="Emo Bot Face - HaxorAI Project" />
    <meta property="og:description" content="Interactive animated bot interface (Emo) built by Samuel Pasaribu under HaxorAI project." />
    <meta property="og:image" content="https://samuel.haxorai.com/emo/thumbnail.png" />
    <meta property="og:url" content="https://samuel.haxorai.com/emo" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HaxorAI Emo Project" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emo Bot Face | HaxorAI" />
    <meta name="twitter:description" content="Interactive AI-style bot face UI project by Samuel Pasaribu." />
    <meta name="twitter:image" content="https://samuel.haxorai.com/emo/thumbnail.png" />
    <link rel="shortcut icon" type="image/x-icon" href="https://web.haxorai.com/favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=trgSJabs" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" defer></script>
</head>

<body translate="no">
<main id="app" aria-label="Emo AI Interface">    
    <div id="container">
        <div id="bot" class="neutral">
            <div id="head">
                <div id="left-ear">
                    <div id="left-ear-inner"></div>
                </div>
                <div id="face">
                    <div id="eyes">
                        <div id="left-eye"></div>
                        <div id="right-eye"></div>
                    </div>
                    <div id="mouth"></div>
                </div>
                <div id="right-ear">
                    <div id="right-ear-inner"></div>
                </div>
            </div>
        </div>
        <ul id="switches"></ul>
    </div>

    <div id="emo-terminal">

        <div class="terminal-header">

            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>

            <span class="terminal-title">
                EMO Assistant v1.0
            </span>

            <button id="emo-menu-btn" onclick="openEmoMenu()" aria-label="Open Menu"></button>

        </div>

        <div id="terminal-output"></div>

    </div>

    </main>

    <div id="emo-modal">

        <div id="emo-modal-box">

            <div id="emo-modal-header">

                <span>Tanya Emo</span>

                <button class="emo-close-btn" onclick="closeEmoMenu()" aria-label="Close Menu"></button>

            </div>

            <div id="emo-modal-content"></div>

        </div>

    </div>

    <div id="music-modal">

        <div id="emo-modal-box">

            <div id="emo-modal-header">

                <span>Music Player</span>

                <button onclick="closeMusicMenu()"></button>

            </div>

            <div id="music-modal-content"></div>

        </div>

    </div>

    <button id="music-btn" onclick="openMusicMenu()" aria-label="Music Player"></button>
    <script src="js/script.js" defer></script>
</body>

</html>
