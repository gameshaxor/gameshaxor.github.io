  <rect x="302" y="160" width="16" height="60" rx="2" ry="2" fill="#d3d3d3" stroke="#fff" stroke-width="3"/>

  <!-- Ear Inner -->
  <rect x="57" y="172" width="16" height="36" rx="2" ry="2" fill="#d3d3d3"/>
  <rect x="323" y="172" width="16" height="36" rx="2" ry="2" fill="#d3d3d3"/>

  <!-- Eyes -->
  <rect x="126" y="150" width="60" height="40" rx="10" ry="10" fill="#20b2aa"/>
  <rect x="217" y="150" width="60" height="40" rx="10" ry="10" fill="#20b2aa"/>

  <!-- Mouth -->
  <path d="M160 240 Q150 250 162 254" stroke="#fff" stroke-width="3" fill="none"/>
