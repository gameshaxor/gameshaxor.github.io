<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:auto;">
  <defs>
    <linearGradient id="googleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="25%" stop-color="#EA4335"/>
      <stop offset="50%" stop-color="#FBBC05"/>
      <stop offset="75%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#4285F4"/>
