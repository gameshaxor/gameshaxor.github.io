    <!-- Path for Curved Text -->
    <path id="curveText" d="M100,290 A109,90 0 0,0 300,290" fill="none"/>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="transparent" stroke="url(#googleGradient)" stroke-width="4" />

  <!-- Face -->
  <rect x="97" y="103" rx="24" ry="24" width="202" height="194" stroke="#fff" stroke-width="6" fill="none"/>

  <!-- Ears -->
